<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#0b1020" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Beamatrix" />

  <title>光軌矩陣 Beamatrix</title>
  <meta name="description" content="雷射導流板益智 PWA 遊戲" />

  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />
  <link rel="icon" type="image/png" href="./icons/icon-192.png" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1>光軌矩陣</h1>
        <p>Beamatrix</p>
      </div>

      <div class="top-actions">
        <button id="restartBtn" class="btn ghost" type="button" aria-label="重新開始本關">
          重來
        </button>
      </div>
    </header>

    <main class="main">
      <section class="panel info-panel" aria-label="關卡資訊">
        <div class="info-row">
          <span>關卡</span>
          <strong id="levelLabel">1</strong>
        </div>
        <div class="info-row">
          <span>收集</span>
          <strong id="starLabel">0 / 0</strong>
        </div>
        <div class="info-row">
          <span>步數</span>
          <strong id="moveLabel">0</strong>
        </div>
      </section>

      <section class="board-wrap" aria-label="遊戲區域">
        <div id="board" class="board" aria-label="遊戲棋盤" role="application"></div>
      </section>

      <section class="panel instruction-panel" aria-label="操作說明">
        <p class="instruction-title">滑動操作</p>
        <p class="instruction-text">
          直接在棋盤上朝四個方向滑動，光球會一路滑行，直到撞牆、踩到停止格，或被導流板轉向。
        </p>
      </section>

      <p id="message" class="message" aria-live="polite">請在棋盤上滑動開始。</p>
    </main>
  </div>

  <div id="overlay" class="overlay hidden" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="overlayTitle" aria-describedby="overlayText">
      <h2 id="overlayTitle">過關成功</h2>
      <p id="overlayText">準備進入下一關</p>
      <button id="overlayBtn" class="btn primary" type="button">下一步</button>
    </div>
  </div>

  <script src="./app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(console.error);
      });
    }
  </script>
</body>
</html>
